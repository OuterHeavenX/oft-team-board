function valid(s){return s&&s.version===1&&s.scores?.length===N&&s.scores.every(r=>Array.isArray(r)&&r.length===B&&r.every(v=>v===''||(Number.isInteger(v)&&v>=1&&v<=10)))&&s.positions?.length===N&&s.positions.every(p=>Number.isFinite(p.x)&&Number.isFinite(p.y)&&p.x>=0&&p.x<=MX&&p.y>=0&&p.y<=MY)&&['today','future'].every(k=>s[k]?.length===N&&new Set(s[k]).size===N&&s[k].every(n=>Number.isInteger(n)&&n>=0&&n<N))&&typeof s.touched?.today==='boolean'&&typeof s.touched?.future==='boolean'&&(s.overall===undefined||(Array.isArray(s.overall)&&s.overall.length===N&&s.overall.every(v=>v===''||(Number.isInteger(v)&&v>=1&&v<=10))))&&(s.notes===undefined||(Array.isArray(s.notes)&&s.notes.length===N&&s.notes.every(t=>typeof t==='string'&&t.length<=2000)))}
let state=fresh(),view='ratings',history=[],q='',sortBy='name',who=0;

const $=s=>document.querySelector(s),main=$('#main'),status=$('#status'),editor=$('#editor'),bk=$('#bk');
const avg=i=>{const v=state.scores[i].filter(x=>x!=='');return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
const band=v=>v==null?'s-none':v<5?'s-lo':v>=7.5?'s-hi':'s-mid';
const ini=n=>n.split(' ').map(w=>w[0]).join('');
function snap(){history.push(JSON.stringify(state));if(history.length>40)history.shift();$('#undo').disabled=false}
function save(){if(subLocked()){status.textContent='Locked until '+fmtD(lockUntil());render();return}updateProg();status.textContent='Saving…';submitted=false;clearTimeout(saveT);saveT=setTimeout(push,600)}
async function push(){const{error}=await sb.from('responses').upsert({reviewer_id:me.id,payload:{...state,notes:undefined,roster:[...names]},submitted},{onConflict:'reviewer_id'});status.textContent=error?'Not saved: '+error.message:submitted?'Submitted':'Saved · draft';return error}
const opts=v=>'<option value="">–</option>'+Array.from({length:10},(_,i)=>`<option ${v===i+1?'selected':''}>${i+1}</option>`).join('');
const grip=i=>`<button class="grip" data-id="${i}" aria-label="Drag ${names[i]}. Arrow keys also move them.">⠿</button>`;
function card(i,rank){const a=avg(i),b=band(a);return `<div class="cardtop">${grip(i)}<span class="ini ${b}">${ini(names[i])}</span><span class="name">${names[i]}</span>${rank?`<span class="avg">${a==null?'':a.toFixed(1)}</span><button class="move" data-edit="${i}" aria-label="Edit ${names[i]} ratings">Edit</button>`:''}</div>${rank?'':`<div class="meter ${b}"><i style="width:${a==null?0:a*10}%"></i></div><div class="detail"><span>Skill <b>${state.scores[i][0]||'–'}</b> · Avg <b>${a==null?'–':a.toFixed(1)}</b></span><button data-edit="${i}">Rate</button></div>`}`}
function applyFilter(){const t=q.trim().toLowerCase();document.querySelectorAll('.canvas .card').forEach(c=>c.classList.toggle('dim',!!t&&!names[+c.dataset.person].toLowerCase().includes(t)))}
function scored(){return state.scores.flat().filter(x=>x!=='').length}
function render(){syncFuture();updateProg();
document.querySelectorAll('nav button').forEach(b=>{const on=b.dataset.view===(view==='tread'?'training':view);b.classList.toggle('active',on);b.setAttribute('aria-pressed',on)});$('#undo').disabled=!history.length;
if(view==='dash'){renderDash();return}
if(view==='people'){renderPeople();return}
if(view==='training'){renderTraining();return}
if(view==='tread'){renderTRead();return}
if(view==='behaviors'){renderBehaviors();return}
if(view==='comments'){renderComments();return}
if(view==='guide'){renderGuide();return}
if(view==='ratings'){const ord=names.map((_,i)=>i);if(sortBy==='avg')ord.sort((a,b)=>(avg(b)??-1)-(avg(a)??-1));
main.innerHTML=`<div class="bar" style="padding:0 0 12px"><label>Sort by <select id="sort" style="padding:7px;border-radius:8px;border:1px solid var(--line);background:var(--surf)"><option value="name">Name</option><option value="avg">Average</option></select></label><span class="sp">Rate 1 to 10. Scores stay with each person.</span></div><div class="tablewrap"><table class="rtable"><thead><tr><th>Person</th>`+labels.map((l,j)=>`<th title="${DESC[j]}">${l}</th>`).join('')+'<th>Overall skill</th><th>Avg</th></tr></thead><tbody>'+ord.map(i=>`<tr><td><div class="rname"><span>${names[i]}</span><button class="cbtn${(state.notes[i]||'').trim()?' has':''}" data-ctog="${i}" aria-expanded="false" aria-label="Comment on ${names[i]}" title="Comment"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></button></div></td>`+labels.map((l,j)=>`<td><select class="${state.scores[i][j]===''?'miss':''}" aria-label="${names[i]}: ${l}" data-score="${i},${j}">${opts(state.scores[i][j])}</select></td>`).join('')+`<td><select class="${state.overall[i]===''?'miss':''}" aria-label="${names[i]}: Overall skill level" data-ov="${i}">${opts(state.overall[i])}</select></td><td class="a" data-avg="${i}">${avg(i)==null?'–':avg(i).toFixed(1)}</td></tr>`).join('')+'</tbody></table></div>';$('#sort').value=sortBy}
else{main.innerHTML=`<div class="bar" style="padding:0 0 12px"><p class="hint" style="margin:0;flex:1">${view==='today'?'Current skill':'Projected skill in two years'}: #1 is strongest. Drag the handle, or use the arrows. Each list is separate.</p>${view==='today'?'<button id="fill">Order by average rating</button>':''}</div>${newNotice()}${state.touched[view]?(view==='future'?'<div class="notice">This list started as a copy of your Skill today order. Move anyone you expect to grow faster or slower over the next 2 years. To start over from your current Skill today order, copy it again.<br><button id="copyToday">Copy my Skill today order</button></div>':''):rankNotice()}<div class="ranklist">`+state[view].map((i,r)=>`<div class="rankrow" data-person="${i}"><span class="ranknum">${r+1}</span><article class="card">${card(i,true)}</article><button class="move" data-step="${i},-1" aria-label="Move ${names[i]} up" ${r===0?'disabled':''}>↑</button><button class="move" data-step="${i},1" aria-label="Move ${names[i]} down" ${r===N-1?'disabled':''}>↓</button></div>`).join('')+'</div>'}
guideBars()}
function reorder(id,to){const a=state[view],f=a.indexOf(id);a.splice(f,1);a.splice(to,0,id);state.touched[view]=true;syncFuture()}
function arrange(order){snap();order.forEach((id,k)=>state.positions[id]=grid(k));save();render()}
function openEditor(i){who=i;const s=state.scores[i];editor.innerHTML=`<div class="dh"><button id="prev" aria-label="Previous person">←</button><h2>${names[i]}</h2><button id="next" aria-label="Next person">→</button></div><p class="hint" style="margin:6px 0 0">1 is lowest, 10 is best. Tap a score again to clear it.</p>`+labels.map((l,j)=>`<div class="fld"><span>${l}<em style="font-style:normal;color:var(--mute)" data-v="${j}">${s[j]||'–'}</em></span>${DESC[j]?`<small class=\"hint\" style=\"display:block;margin:2px 0 0\">${DESC[j]}</small>`:''}<div class="chips" data-f="${j}">${Array.from({length:10},(_,k)=>`<button data-s="${j},${k+1}" class="${s[j]===k+1?'on':''}" aria-label="${l} ${k+1}">${k+1}</button>`).join('')}</div></div>`).join('')+`<div class="fld ovf"><span>Overall skill level</span><small class="hint" style="display:block;margin:2px 0 0">Your overall grade for this person, all things considered.</small><div class="chips" data-of="${i}">${Array.from({length:10},(_,k)=>`<button data-o="${i},${k+1}" class="${state.overall[i]===k+1?'on':''}" aria-label="Overall skill level ${k+1}">${k+1}</button>`).join('')}</div></div><div class="fld"><span>Comments <small style="font-weight:400;color:var(--mute)">(optional)</small></span><textarea class="note" data-n="${i}" maxlength="2000" placeholder="Strengths, concerns, examples">${esc(state.notes[i]||'')}</textarea></div>`+'<button class="primary" id="done">Done</button>';if(!editor.open)editor.showModal()}
editor.onclick=e=>{const c=e.target.closest('[data-s]');if(c){const [j,v]=c.dataset.s.split(',').map(Number);snap();state.scores[who][j]=state.scores[who][j]===v?'':v;save();const s=state.scores[who][j];editor.querySelectorAll(`[data-f="${j}"] button`).forEach((b,k)=>b.classList.toggle('on',s===k+1));editor.querySelector(`[data-v="${j}"]`).textContent=s||'–';return}

$('nav').onclick=e=>{const v=e.target.closest('[data-view]')?.dataset.view;if(v){$('nav').classList.remove('open');$('#navtoggle').setAttribute('aria-expanded','false')}if(!v)return;if(v==='guide')go(0);else{guideOn=false;view=v;render()}};

let drag=null,frame=null;
main.addEventListener('pointerdown',e=>{const h=e.target.closest('.grip');if(!h||e.button!==0)return;const id=+h.dataset.id,vp=$('.viewport');drag={id,h,p:e.pointerId,sx:e.clientX,sy:e.clientY,moved:false,before:JSON.stringify(state),pos:{...state.positions[id]},y:e.clientY,wy:scrollY,sl:vp?vp.scrollLeft:0,st:vp?vp.scrollTop:0};h.setPointerCapture(e.pointerId);e.preventDefault()});

function lift(){const row=drag.h.closest('.rankrow'),rows=[...document.querySelectorAll('.rankrow')];drag.row=row;drag.rows=rows;drag.from=rows.indexOf(row);drag.to=drag.from;drag.rh=rows.length>1?rows[1].getBoundingClientRect().top-rows[0].getBoundingClientRect().top:row.offsetHeight+8;row.parentElement.classList.add('dragging');row.classList.add('lifted');try{navigator.vibrate&&navigator.vibrate(10)}catch{}}
function moveRank(){if(!drag||!drag.row)return;const dy=drag.y-drag.sy+scrollY-drag.wy,max=drag.rows.length-1;drag.row.style.transform=`translateY(${dy}px)`;const to=Math.max(0,Math.min(max,drag.from+Math.round(dy/drag.rh)));drag.to=to;

e.target.disabled=true;m.textContent='Uploading '+f.name+'…';const path=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36))+'/'+f.name.replace(/[^\w.\-]+/g,'_');
const up=await sb.storage.from('training').upload(path,f,{contentType:f.type||'application/octet-stream',upsert:false});if(up.error){e.target.disabled=false;m.textContent='Upload failed: '+up.error.message;return}
const{error}=await sb.from('training').insert({title:ti,category:ca,description:de,file_path:path,file_name:f.name,file_size:f.size});if(error){await sb.storage.from('training').remove([path]);e.target.disabled=false;m.textContent='Could not save: '+error.message;return}
tcache=null;renderTraining('Added “'+ti+'”.')}});
function alertMsg(t){const m=document.createElement('p');m.className='hint';m.style.cssText='color:#c4421a;font-weight:600';m.textContent=t;main.prepend(m);setTimeout(()=>m.remove(),6000)}
$('#navtoggle').onclick=()=>{const n=$('nav'),o=!n.classList.contains('open');n.classList.toggle('open',o);$('#navtoggle').setAttribute('aria-expanded',o);setHH()};
function syncNavToggle(){const a=document.querySelector('nav button.active'),t=$('#navtoggle');if(!t)return;$('#navcur').textContent=a?a.childNodes[0].textContent.trim():'Menu';t.classList.toggle('hasdot',!!document.querySelector('nav .dot'));t.style.display=document.querySelectorAll('nav button').length<=1?'none':''}
let treadId=null;const timgCache={};
async function renderTRead(){if(!tcache){main.innerHTML='<p class="hint">Loading…</p>';const{data}=await sb.from('training').select('*').order('created_at',{ascending:false});tcache=data||[]}
const x=tcache.find(r=>r.id===treadId);if(!x||!x.body){view='training';renderTraining();return}
main.innerHTML=`<div class="tart"><button class="tback" data-tback>← All training</button>${x.body}${x.file_path?`<p style="text-align:center;margin:18px 0"><button data-topen="${esc(x.id)}">Open the original PDF</button></p>`:''}<p style="text-align:center"><button class="tback" data-tback>← All training</button></p></div>`;scrollTo(0,0);
let im=timgCache[x.id];if(!im){const{data}=await sb.from('training_images').select('key,mime,data').eq('training_id',x.id);im=timgCache[x.id]=Object.fromEntries((data||[]).map(r=>[r.key,`data:${r.mime};base64,${r.data}`]))}
if(view!=='tread'||treadId!==x.id)return;main.querySelectorAll('img[data-k]').forEach(i=>{if(im[i.dataset.k])i.src=im[i.dataset.k]})}
main.addEventListener('click',e=>{const r=e.target.closest('[data-tread]');if(r){treadId=r.dataset.tread;view='tread';render();return}if(e.target.closest('[data-tback]')){view='training';render();scrollTo(0,0);return}
const a=e.target.closest('.ta-toc a');if(a){e.preventDefault();jumpTo(a.getAttribute('href'))}});
function jumpTo(sel){const el=document.querySelector(sel);if(!el)return;const h=document.querySelector('header'),off=(h?h.getBoundingClientRect().bottom:0)+10;scrollTo({top:el.getBoundingClientRect().top+scrollY-off,behavior:'smooth'})}
boot();
</script></body></html>
